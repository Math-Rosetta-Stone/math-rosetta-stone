services:
  app:
    build: .
    container_name: app  # <--- Add this line
    restart: always
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: nginx # <--- Add this line for consistency
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params:/etc/nginx/proxy_params:ro
